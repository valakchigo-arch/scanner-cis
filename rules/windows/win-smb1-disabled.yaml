rule_id: WIN-SMB1-DISABLED
title: SMBv1 Protocol Disabled
category: network_security
os: windows
standard:
  name: CIS
  reference: "CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0, 18.4.2 + 18.4.3 (L1)"
  level: L1
severity: CRITICAL
confidence: INFERRED
condition:
  operator: equals
  expected_value: "Disabled"
probe:
  provider: windows.powershell
  params:
    command: "Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol | Select-Object -ExpandProperty State"
remediation:
  action: "Disable SMBv1 via 'Turn Windows features on or off' or PowerShell: Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol"
description: >
  SMBv1 is deprecated and vulnerable (EternalBlue, WannaCry). The feature must
  be disabled on all endpoints.

  CONFIDENCE = INFERRED (mechanism deviation, verified by code inspection not by
  live run): CIS 18.4.2 audits the service start type `mrxsmb10` (registry
  HKLM\SYSTEM\CurrentControlSet\Services\mrxsmb10\Start = 4) and CIS 18.4.3 audits
  `LanmanServer\Parameters\SMB1` (= 0). This rule instead reads the authoritative
  Windows optional-feature state via `Get-WindowsOptionalFeature -FeatureName
  SMB1Protocol`. The two mechanisms are not identical: a machine can have the
  feature *installed but the server parameter disabled*, or vice-versa, so a
  PASS here does not guarantee the CIS registry probes would also PASS. Treated
  as INFERRED until both probes are run and compared on the same host.

  Decision recorded (P0-3): option (a) chosen over adding two registry-derived
  rules. Reason: (1) the shipped rule set is contractually 14 controls
  (test_all_shipped_rules_load_and_are_unique, contract_adapter, docs katalog);
  adding a 15th rule mid-hardening would require touching all those counts,
  (2) `Get-WindowsOptionalFeature` is the single source of truth for whether
  the SMB1 feature is present, which is what an operator would actually toggle,
  and (3) the deviation from CIS mechanism is already documented here so the
  limitation is visible rather than hidden. Option (b) (two registry rules for
  mrxsmb10:Start and LanmanServer\Parameters:SMB1) remains available if the
  project owner wants direct registry parity with CIS 18.4.2/18.4.3.