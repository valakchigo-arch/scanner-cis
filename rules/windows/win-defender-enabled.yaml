rule_id: WIN-DEFENDER-ENABLED
title: Windows Defender Antivirus Enabled
category: compromise_indicators
os: windows
standard:
  name: CIS
  reference: "CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0, 18.10.43.10.3 (L1)"
  level: L1
  severity: CRITICAL
confidence: DIRECT
condition:
  operator: equals
  expected_value: false
probe:
  provider: windows.powershell
  params:
    command: "(Get-MpPreference).DisableRealtimeMonitoring"
remediation:
  action: "Enable Windows Defender real-time protection"
description: >
  Windows Defender real-time monitoring must be enabled.
  Note: command returns False when protection IS enabled (DisableRealtimeMonitoring=False).