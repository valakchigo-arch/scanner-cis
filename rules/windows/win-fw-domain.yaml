rule_id: WIN-FW-DOMAIN
title: Windows Firewall Domain Profile Enabled
category: network_security
os: windows
description: >
  Windows Firewall must be enabled for the Domain profile to block
  unauthorized inbound connections on domain-joined endpoints.
standard:
  name: CIS
  reference: "CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0, 9.1.1 (L1)"
  level: L1
severity: CRITICAL
confidence: DIRECT
condition:
  operator: equals
  expected_value: true
probe:
  provider: windows.powershell
  params:
    command: "Get-NetFirewallProfile -Name Domain | Select-Object -ExpandProperty Enabled"
remediation:
  action: >
    Enable Windows Firewall for Domain profile via Group Policy
    (Computer Configuration > Windows Settings > Security Settings >
    Windows Firewall with Advanced Security) or:
    Set-NetFirewallProfile -Name Domain -Enabled True