rule_id: WIN-PASS-MINLEN
title: Minimum Password Length 14 Characters or More
category: authentication
os: windows
description: >
  Minimum password length must be at least 14 characters to resist
  brute-force and dictionary attacks. Value is read from the effective
  local security policy via secedit export.
standard:
  name: CIS
  reference: "CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0, 1.1.4 (L1)"
  level: L1
severity: HIGH
confidence: DIRECT
condition:
  operator: gte
  expected_value: 14
probe:
  provider: windows.powershell
  params:
    command: |
      $t = Join-Path $env:TEMP ('secpol_' + [guid]::NewGuid().ToString('N') + '.inf')
      try {
        secedit /export /cfg $t /quiet | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "secedit gagal (exit $LASTEXITCODE) - butuh Administrator" }
        $m = Select-String -Path $t -Pattern '^MinimumPasswordLength\s*=\s*(-?\d+)'
        if (-not $m) { throw 'MinimumPasswordLength tidak ditemukan pada hasil export' }
        $m.Matches[0].Groups[1].Value
      } finally { Remove-Item $t -Force -ErrorAction SilentlyContinue }
remediation:
  action: >
    Set via Group Policy: Computer Configuration > Windows Settings >
    Security Settings > Account Policies > Password Policy >
    "Minimum password length" = 14 or more.
    Or via secedit /configure with a custom INF.