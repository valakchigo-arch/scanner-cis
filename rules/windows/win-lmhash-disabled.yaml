rule_id: WIN-LMHASH-DISABLED
title: LM Hash Storage Disabled
category: cryptography
os: windows
standard:
  name: CIS
  reference: "CIS Microsoft Windows 10 Enterprise Benchmark v4.0.0, 2.3.11.5 (L1)"
  level: L1
  severity: HIGH
confidence: INFERRED
condition:
  operator: not_in
  expected_value: [0, "0"]
probe:
  provider: windows.registry
  params:
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa"
    key: NoLMHash
remediation:
  action: "Set NoLMHash to 1 in registry to explicitly disable LM hash storage"
description: >
  LM hash must be disabled. NoLMHash=1 or missing key (modern Windows default) = PASS.
  NoLMHash=0 = LM hash enabled = FAIL.