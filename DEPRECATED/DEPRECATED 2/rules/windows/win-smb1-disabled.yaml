rule_id: WIN-SMB1-DISABLED
title: SMBv1 Protocol Disabled
category: network_security
os: windows
standard:
  name: CIS
  reference: "CIS Windows Server 2019 9.2.1"
severity: CRITICAL
confidence: DIRECT
condition:
  operator: equals
  expected_value: "Disabled"
probe:
  provider: windows.powershell
  params:
    command: "Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol | Select-Object -ExpandProperty State"
remediation:
  action: "Disable SMBv1 via 'Turn Windows features on or off' or PowerShell"
description: >
  SMBv1 is deprecated and vulnerable (EternalBlue, WannaCry).
  Must be disabled on all endpoints.