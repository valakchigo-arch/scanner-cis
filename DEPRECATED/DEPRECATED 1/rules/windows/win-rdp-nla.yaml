rule_id: WIN-RDP-NLA
title: RDP Network Level Authentication Required
category: network_security
os: windows
description: >
  RDP must require Network Level Authentication (NLA) to prevent
  unauthenticated access to the login screen and reduce RDP attack surface.
standard:
  name: CIS
  reference: "CIS Windows Server 2019 18.9.63.1"
severity: CRITICAL
confidence: DIRECT
condition:
  operator: equals
  expected_value: 1
probe:
  provider: windows.registry
  params:
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp"
    key: "UserAuthentication"
remediation:
  action: >
    Set via Group Policy: Computer Configuration > Administrative Templates >
    Windows Components > Remote Desktop Services > Remote Desktop Session Host >
    Security > "Require user authentication for remote connections by using
    Network Level Authentication" = Enabled.
    Or set registry UserAuthentication = 1.