rule_id: WIN-PASS-MINLEN
title: Minimum Password Length 14 Characters or More
category: authentication
os: windows
description: >
  Minimum password length must be at least 14 characters to resist
  brute-force and dictionary attacks. Value is read from the effective
  local security policy via secedit export.
standard:
  name: CIS
  reference: "CIS Windows Server 2019 1.1.4"
severity: HIGH
confidence: DIRECT
condition:
  operator: gte
  expected_value: 14
probe:
  provider: windows.powershell
  params:
    command: |
      $tmp = "$env:TEMP\secpol_minlen.inf"
      secedit /export /cfg $tmp | Out-Null
      (Get-Content $tmp | Select-String "^MinimumPasswordLength\s*=") -replace ".*=\s*", ""
remediation:
  action: >
    Set via Group Policy: Computer Configuration > Windows Settings >
    Security Settings > Account Policies > Password Policy >
    "Minimum password length" = 14 or more.
    Or via secedit /configure with a custom INF.